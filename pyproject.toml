[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_grpc"
version = "0.1.0"
description = "gRPC follower/leader devices for lerobot — decoupled from the lerobot source tree."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Yiming Yang" }]
dependencies = [
    # lerobot base (ships opencv-python-headless) + the gRPC stack it already pins.
    "lerobot[grpcio-dep]>=0.6.1,<0.7",
]

[project.optional-dependencies]
# Client-side extras for recording + visualization (recording/training machine)
client = [
    "lerobot[dataset]>=0.6.1,<0.7",
    "lerobot[hardware]>=0.6.1,<0.7",
    "lerobot[viz]>=0.6.1,<0.7",
]
# Server-side: wraps real SO101 hardware
server = [
    "lerobot[feetech]>=0.6.1,<0.7",
]
# Everything (client + server on same machine, typical dev setup)
all = [
    "lerobot_robot_grpc[client]",
    "lerobot_robot_grpc[server]",
]

[tool.setuptools.packages.find]
include = ["lerobot_robot_grpc*"]
